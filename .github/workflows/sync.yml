name: Sync meetings
on:
  schedule:
    - cron: "0 13 * * 5" # Fridays 13:00 UTC — post-meeting sync (meetings are Thursday evenings)
    - cron: "0 23 * * 2" # Tuesdays 23:00 UTC (6 pm CT) — agenda preview ahead of Thursday's meeting
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'schedule' || github.event.schedule == '0 13 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg poppler-utils
      - name: Discover meetings (agendas, captions, manifests)
        run: python3 scripts/hsvcc.py discover
      - name: Commit discovered artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meetings/
          git diff --cached --quiet || git commit -m "chore: sync meetings $(date -u +%F)"
      - name: Extract votes from published minutes
        run: python3 scripts/hsvcc.py extract-votes
      - name: Commit votes
        run: |
          git add meetings/
          git diff --cached --quiet || git commit -m "chore: extract votes from minutes"
      - name: Extract + publish audio release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/hsvcc.py fetch-audio --all-pending --publish
      - name: Commit manifest audio flags and push
        run: |
          git add meetings/
          git diff --cached --quiet || git commit -m "chore: record published audio assets"
          # main may have moved while this job ran (races with local pushes)
          git pull --rebase origin main
          git push

  # Tuesday evenings: grab upcoming agendas from Legistar before Thursday's
  # meeting, summarize the topics, and check the links inside each agenda.
  # `needs: sync` serializes the two jobs' pushes on workflow_dispatch;
  # always() keeps this job running on Tuesdays when sync is skipped.
  preview:
    needs: sync
    if: always() && (github.event_name != 'schedule' || github.event.schedule == '0 23 * * 2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Fetch upcoming agendas, summarize topics, check links
        run: python3 scripts/hsvcc.py preview-agendas
      - name: Commit agenda previews and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A upcoming/ meetings/
          git diff --cached --quiet || git commit -m "chore: agenda preview $(date -u +%F)"
          # main may have moved while this job ran (races with local pushes)
          git pull --rebase origin main
          git push
